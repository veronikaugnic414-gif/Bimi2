<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BiMi Household</title>

  <!-- PWA & Favicons -->
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Шрифт Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col md:flex-row min-h-screen bg-gradient-to-br from-purple-100/60 via-fuchsia-50/40 to-pink-100/50 text-gray-800 antialiased selection:bg-purple-200">

  <!-- Контейнер для тостів / сповіщень -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- МОДАЛКА ВХОДУ -->
  <div id="user-modal" class="fixed inset-0 bg-purple-950/20 backdrop-blur-xl z-50 flex items-center justify-center p-4">
    <div class="glass-card p-8 w-full max-w-sm text-center shadow-2xl rounded-3xl border border-white/80">
      <div class="w-12 h-12 mx-auto mb-4 bg-gradient-to-tr from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-md text-white">
        <i data-lucide="user-check" class="w-6 h-6"></i>
      </div>
      <h2 class="text-xl font-semibold mb-1 text-gray-900 tracking-tight">Вітаємо!</h2>
      <p class="text-gray-500 mb-6 text-xs font-medium">Обери свій профіль для входу</p>
      
      <div class="space-y-2.5">
        <button id="btn-veronika" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 text-sm rounded-2xl shadow-md shadow-purple-200 transition cursor-pointer flex items-center justify-center gap-2">
          <i data-lucide="user" class="w-4 h-4"></i> Вероніка
        </button>
        <button id="btn-dasha" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 text-sm rounded-2xl shadow-md shadow-pink-200 transition cursor-pointer flex items-center justify-center gap-2">
          <i data-lucide="user" class="w-4 h-4"></i> Даша
        </button>
      </div>
    </div>
  </div>

  <!-- БІЧНЕ МЕНЮ ДЛЯ ПК -->
  <aside class="hidden md:flex flex-col w-72 bg-white/70 backdrop-blur-2xl border-r border-white/80 p-6 sticky top-0 h-screen justify-between shadow-xs">
    <div>
      <div class="flex items-center justify-between mb-8 px-2">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
            <img src="/icons/favicon.png" alt="BiMi" class="w-8 h-8 rounded-xl object-cover">
          </div>
          <div>
            <span class="font-semibold text-lg text-gray-900">BiMi</span>
            <p class="text-[10px] text-purple-600 font-semibold uppercase tracking-wider">Household Management</p>
          </div>
        </div>
        <button id="btn-theme-desktop" class="p-2 rounded-2xl bg-purple-100/60 hover:bg-purple-200/80 transition cursor-pointer text-purple-900" title="Змінити тему">
          <i id="theme-icon-desktop" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="space-y-1">
        <button data-tab="dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> <span>Головна</span>
        </button>
        <button data-tab="calendar" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="calendar" class="w-4 h-4"></i> <span>Календар</span>
        </button>
        <button data-tab="menu" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="utensils" class="w-4 h-4"></i> <span>Тижневе меню</span>
        </button>
        <button data-tab="recipes" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="book-open" class="w-4 h-4"></i> <span>Рецепти</span>
        </button>
        <button data-tab="fridge" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="archive" class="w-4 h-4"></i> <span>Холодильник</span>
        </button>
        <button data-tab="shopping" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i> <span>Покупки</span>
        </button>
        <button data-tab="finance" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-2xl font-semibold text-gray-600 hover:bg-white/80 hover:text-purple-600 transition text-sm">
          <i data-lucide="wallet" class="w-4 h-4"></i> <span>Бюджет</span>
        </button>
      </nav>
    </div>

    <div class="pt-4 border-t border-purple-100/60 flex justify-between items-center px-2">
      <span id="user-display-desktop" class="font-semibold text-sm text-gray-900">...</span>
      <button id="btn-change-user-desktop" class="text-xs bg-white hover:bg-purple-50 text-purple-700 border border-purple-100 px-3 py-1.5 rounded-xl font-semibold transition">Змінити</button>
    </div>
  </aside>

  <!-- ОСНОВНИЙ КОНТЕНТ -->
  <div class="flex-1 flex flex-col pb-24 md:pb-6">
    <header class="md:hidden bg-white/80 backdrop-blur-xl px-5 py-3.5 sticky top-0 z-30 flex justify-between items-center border-b border-white/60">
      <span id="user-display" class="font-semibold text-gray-900 text-base">Вітаю!</span>
      <div class="flex items-center gap-2">
        <button id="btn-theme-mobile" class="p-2 rounded-xl bg-purple-100/80 text-purple-900 transition cursor-pointer" title="Змінити тему">
          <i id="theme-icon-mobile" data-lucide="moon" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btn-change-user-mobile" class="text-xs bg-purple-100/80 text-purple-900 px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Профіль
        </button>
      </div>
    </header>

    <main id="app-content" class="p-4 md:p-8 max-w-4xl mx-auto w-full"></main>
  </div>

  <!-- Мобільна панель -->
  <nav class="md:hidden fixed bottom-3 left-3 right-3 bg-white/90 backdrop-blur-2xl border border-white/90 rounded-3xl py-2 px-2 z-40 shadow-xl">
    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
      <button data-tab="dashboard" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Головна</span>
      </button>
      <button data-tab="calendar" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="calendar" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Календар</span>
      </button>
      <button data-tab="menu" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="utensils" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Меню</span>
      </button>
      <button data-tab="recipes" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="book-open" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Рецепти</span>
      </button>
      <button data-tab="fridge" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="archive" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Холодильник</span>
      </button>
      <button data-tab="shopping" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Покупки</span>
      </button>
      <button data-tab="finance" class="nav-btn flex-shrink-0 flex flex-col items-center px-3 py-1 rounded-2xl text-gray-400 cursor-pointer">
        <i data-lucide="wallet" class="w-4 h-4"></i><span class="text-[10px] font-semibold mt-1 whitespace-nowrap">Бюджет</span>
      </button>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
