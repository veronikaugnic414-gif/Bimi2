<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BiMi Household</title>

  <!-- PWA & Native iOS Status Bar: #080A10 System Dark -->
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json"[cite: 1]>
  <meta name="theme-color" content="#080A10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#080A10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BiMi">

  <!-- Inter / System Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-mode">

  <div id="toast-container" class="toast-wrapper" aria-live="polite"></div>

  <!-- Модальне вікно вибору профілю (Bottom Sheet) -->
  <div id="user-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="bottom-sheet user-sheet">
      <div class="sheet-indicator"></div>
      <div class="sheet-header">
        <div class="user-avatar-icon">
          <i data-lucide="user-check" class="icon-lg"></i>
        </div>
        <h2 class="text-card-title" style="margin-top: 8px;">Обери профіль</h2>
        <p class="text-secondary" style="margin-top: 4px;">Спільне господарство BiMi</p>
      </div>
      
      <div class="sheet-actions">
        <button id="btn-veronika" class="btn btn-veronika" type="button">
          <i data-lucide="user" class="icon-md"></i>
          <span>Вероніка</span>
        </button>
        <button id="btn-dasha" class="btn btn-dasha" type="button">
          <i data-lucide="user" class="icon-md"></i>
          <span>Даша</span>
        </button>
      </div>
    </div>
  </div>

  <div class="app-layout">
    <!-- Десктопний сайдбар -->
    <aside class="desktop-sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <img src="/icons/favicon.png" alt="BiMi" class="logo-img">
        </div>
        <div class="brand-text">
          <span class="brand-title">BiMi</span>
          <span class="brand-subtitle">HOUSEHOLD</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button data-tab="dashboard" class="nav-btn active" type="button">
          <i data-lucide="layout-dashboard" class="icon-md"></i>
          <span>Головна</span>
        </button>
        <button data-tab="calendar" class="nav-btn" type="button">
          <i data-lucide="calendar" class="icon-md"></i>
          <span>Календар</span>
        </button>
        <button data-tab="menu" class="nav-btn" type="button">
          <i data-lucide="utensils" class="icon-md"></i>
          <span>Меню</span>
        </button>
        <button data-tab="recipes" class="nav-btn" type="button">
          <i data-lucide="book-open" class="icon-md"></i>
          <span>Рецепти</span>
        </button>
        <button data-tab="fridge" class="nav-btn" type="button">
          <i data-lucide="archive" class="icon-md"></i>
          <span>Холодильник</span>
        </button>
        <button data-tab="shopping" class="nav-btn" type="button">
          <i data-lucide="shopping-bag" class="icon-md"></i>
          <span>Покупки</span>
        </button>
        <button data-tab="finance" class="nav-btn" type="button">
          <i data-lucide="wallet" class="icon-md"></i>
          <span>Бюджет</span>
        </button>
      </nav>

      <div class="sidebar-user-section">
        <span id="user-display-desktop" class="user-name-label">Вероніка</span>
        <button id="btn-change-user-desktop" class="btn btn-ghost btn-sm" type="button">Змінити</button>
      </div>
    </aside>

    <!-- Основний контейнер додатку -->
    <div class="app-main">
      <header class="app-header">
        <div class="header-greeting">
          <span class="header-pretitle">Привіт,</span>
          <h1 id="user-display" class="header-title">Вероніка</h1>
        </div>
        <div class="header-actions">
          <button id="btn-change-user-mobile" class="btn-icon" title="Змінити профіль" aria-label="Змінити профіль" type="button">
            <i data-lucide="user" class="icon-md"></i>
          </button>
        </div>
      </header>

      <main id="app-content" class="content-scrollable"></main>
    </div>
  </div>

  <!-- iOS-стилізований Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button data-tab="dashboard" class="nav-btn active" type="button">
      <div class="nav-pill"><i data-lucide="layout-dashboard" class="icon-md"></i></div>
      <span class="nav-label">Головна</span>
    </button>
    <button data-tab="calendar" class="nav-btn" type="button">
      <div class="nav-pill"><i data-lucide="calendar" class="icon-md"></i></div>
      <span class="nav-label">Календар</span>
    </button>
    <button data-tab="menu" class="nav-btn" type="button">
      <div class="nav-pill"><i data-lucide="utensils" class="icon-md"></i></div>
      <span class="nav-label">Меню</span>
    </button>
    <button data-tab="recipes" class="nav-btn" type="button">
      <div class="nav-pill"><i data-lucide="book-open" class="icon-md"></i></div>
      <span class="nav-label">Рецепти</span>
    </button>
    <button data-tab="fridge" class="nav-btn" type="button">
      <div class="nav-pill"><i data-lucide="archive" class="icon-md"></i></div>
      <span class="nav-label">Холодильник</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
